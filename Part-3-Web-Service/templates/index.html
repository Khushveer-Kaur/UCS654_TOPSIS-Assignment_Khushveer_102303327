<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TOPSIS Web Service</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
        }

        .container {
            width: 450px;
            margin: 60px auto;
            background: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            color: #2c3e50;
        }

        label {
            font-weight: bold;
            display: block;
            margin-top: 15px;
        }

        input[type="text"],
        input[type="email"],
        input[type="file"] {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
        }

        .hint {
            font-size: 12px;
            color: #555;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 10px;
            background-color: #3498db;
            border: none;
            color: white;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
        }

        button:hover {
            background-color: #2980b9;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>TOPSIS Web Service</h1>

        <form method="POST" enctype="multipart/form-data">

            <label>Upload CSV File</label>
            <input type="file" name="file" required>
            <div class="hint">CSV file only</div>

            <label>Weights (comma separated)</label>
            <input type="text" name="weights" value="1,1,1,1,1" required>
            <div class="hint">Example: 1,1,1,1,1</div>

            <label>Impacts (comma separated)</label>
            <input type="text" name="impacts" value="+,+,+,-,+" required>
            <div class="hint">Use + for benefit, - for cost</div>

            <label>Email ID</label>
            <input type="email" name="email" placeholder="example@gmail.com" required>

            <button type="submit">Submit</button>

        </form>
    </div>
</body>
</html>
